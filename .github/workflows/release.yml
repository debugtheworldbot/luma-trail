name: Release

# Every push to main builds the Apple Silicon app and publishes the zip
# to a GitHub Release. The tag is v<CFBundleShortVersionString>-<short sha>.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialize publishing so an older run cannot replace the current update feed.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          arch=$(uname -m)
          echo "runner arch: ${arch}"
          echo "xcode: $(xcode-select -p)"
          if [[ "$arch" != "arm64" ]]; then
            echo "build.sh targets arm64-apple-macosx13.0; this runner is ${arch}." >&2
            exit 1
          fi

      - name: Test update publication safeguards
        run: python3 tests/test_update_publication.py

      - name: Build
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Configure the SPARKLE_PRIVATE_KEY repository secret before publishing updates." >&2
            exit 1
          fi
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)) bash build.sh

      - name: Publish GitHub Release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash .github/scripts/publish-release.sh

  publish-update:
    name: Publish in-app update
    needs: release
    uses: ./.github/workflows/publish-update.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
